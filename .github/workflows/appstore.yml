name: Download App Store Reviews

on:
  workflow_dispatch:

  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: write

jobs:
  reviews:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run scraper
        run: |
          python appstore.py

      - name: Verify reviews.json exists
        run: |
          pwd
          ls -lah
          if [ ! -f reviews.json ]; then
            echo "ERROR: reviews.json not found!"
            exit 1
          fi

      - name: Commit reviews.json back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add reviews.json

          git diff --staged --quiet || git commit -m "Update reviews.json"

          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: appstore-reviews
          path: reviews.json
