name: Download 20min Articles & Comments

on:
  workflow_dispatch:

  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Run scraper
        run: |
          python 20min.py

      - name: Verify JSON exists
        run: |
          pwd
          ls -lah

          if [ ! -f 20min_articles_comments.json ]; then
            echo "ERROR: 20min_articles_comments.json not found!"
            exit 1
          fi

      - name: Commit JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add 20min_articles_comments.json
          git diff --staged --quiet || git commit -m "Update 20min comments"
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 20min-comments
          path: 20min_articles_comments.json
